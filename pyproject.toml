[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miningtoolbox-mcp"
version = "0.1.0"
description = "Mining engineering toolbox as MCP server — zero IAPWS dependency"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/miningtoolbox"]
